name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Build (con reintentos por si el servidor de Forge va lento)
        run: |
          for i in 1 2 3; do
            gradle build --no-daemon -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.repository.max.retries=6 && exit 0
            echo "Intento $i fallo, reintentando..."; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: horrormod-jar
          path: build/libs/horrormod-1.0.0.jar
